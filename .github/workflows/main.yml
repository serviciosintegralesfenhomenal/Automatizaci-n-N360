name: Publicacion Automatica de Noticias

on:
  schedule:
    # Se ejecuta automáticamente al minuto 0 de CADA HORA
    - cron: '0 * * * *'
  # Permite presionar el botón "Run workflow" manualmente
  workflow_dispatch:

jobs:
  publicar:
    runs-on: ubuntu-latest

    steps:
    - name: Descargar código del repositorio
      uses: actions/checkout@v3

    - name: Configurar versión de Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Instalar librerías necesarias
      run: |
        python -m pip install --upgrade pip
        pip install requests feedparser google-genai

    - name: Ejecutar script de publicación en Sanity
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        SANITY_TOKEN: ${{ secrets.SANITY_TOKEN }}
      run: python publicar_noticia.py
