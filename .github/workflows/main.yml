name: Publicacion Automatica de Noticias

on:
  schedule:
    # Se ejecuta automáticamente todos los días a las 8:00 AM UTC
    - cron: '0 8 * * *'
  # Permite presionar un botón para probar el flujo manualmente
  workflow_dispatch:

jobs:
  publicar:
    runs-on: ubuntu-latest

    steps:
    - name: Descargar código del repositorio
      uses: actions/checkout@v3

    - name: Configurar versión de Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Instalar librerías necesarias
      run: |
        python -m pip install --upgrade pip
        pip install requests

    - name: Ejecutar script de publicación en Sanity
      run: python publicar_noticia.py
